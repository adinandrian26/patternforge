name: Windows native release

# Manual trigger only. Builds and validates PatternForge on native
# Windows (windows-latest provides the MSVC linker unavailable locally).
# Bundle is enabled with real deterministic icons
# (apps/desktop/src-tauri/icons/, see scripts/generate-icons.mts), so a
# genuine NSIS installer is expected: the artifact check FAILS if none
# is produced. No fake icons, no fake installer, no forced activation
# beyond the validated prerequisites.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust toolchain
        run: |
          cargo --version
          rustc --version

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Production build (Vite)
        run: npm run build

      - name: Check Tauri bundle prerequisites
        id: bundle-check
        run: |
          $conf = Get-Content -LiteralPath "apps/desktop/src-tauri/tauri.conf.json" | ConvertFrom-Json
          $bundleActive = $conf.bundle.active -eq $true
          $iconsPresent = Test-Path -LiteralPath "apps/desktop/src-tauri/icons"
          "bundle_active=$bundleActive" >> $env:GITHUB_OUTPUT
          "icons_present=$iconsPresent" >> $env:GITHUB_OUTPUT
          $lines = @(
            "## Tauri bundle prerequisites",
            "",
            "- productName: $($conf.productName)",
            "- identifier: $($conf.identifier)",
            "- version: $($conf.version)",
            "- frontendDist: $($conf.build.frontendDist)",
            "- bundle.active: $bundleActive",
            "- icons/ present: $iconsPresent"
          )
          if (-not $bundleActive -or -not $iconsPresent) {
            $lines += "- installer: BLOCKED until real icons exist and bundle is enabled (no fake icons, no forced activation)"
          }
          $lines -join "`n" >> $env:GITHUB_STEP_SUMMARY

      - name: Build Tauri Windows app
        run: npm run tauri:build

      - name: Check installer artifacts
        id: artifacts
        run: |
          $bundleDir = "apps/desktop/src-tauri/target/release/bundle"
          $installers = @()
          if (Test-Path -LiteralPath $bundleDir) {
            $installers = @(Get-ChildItem -Path $bundleDir -Recurse -Include "*.msi", "*-setup.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 0 })
          }
          $hasInstaller = $installers.Count -gt 0
          "has_installer=$hasInstaller" >> $env:GITHUB_OUTPUT
          $bundleActive = "${{ steps.bundle-check.outputs.bundle_active }}" -eq "True"
          $iconsPresent = "${{ steps.bundle-check.outputs.icons_present }}" -eq "True"
          if ($hasInstaller) {
            $names = ($installers | ForEach-Object { $_.FullName }) -join "`n"
            @("## Installer artifacts", "", $names) -join "`n" >> $env:GITHUB_STEP_SUMMARY
          } elseif ($bundleActive -and $iconsPresent) {
            "## Installer artifacts`n`nFAIL: bundle is enabled and icons exist but no installer was produced." >> $env:GITHUB_STEP_SUMMARY
            exit 1
          } else {
            @("## Installer artifacts", "", "No installer produced (bundle disabled or icons missing). Native compile above is the verified result.") -join "`n" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload Windows installer
        if: steps.artifacts.outputs.has_installer == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: patternforge-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
