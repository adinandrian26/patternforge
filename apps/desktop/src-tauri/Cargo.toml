[package]
name = "patternforge"
version = "0.1.0"
description = "PatternForge desktop shell"
authors = ["PatternForge"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "patternforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
